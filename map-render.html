<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre circuit touristique — rendu haute résolution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>body{margin:0;background:#fdf3e3}#map{display:none}#output{display:block;width:100%;height:auto}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body><div id="map"></div><canvas id="output" width="4961" height="3508" aria-label="Notre circuit touristique du Mile End"></canvas>
<script type="module">
import { mountMap3D, STOPS } from './map3d.js';
window.__done = false;
try {
  await document.fonts.load('100px "Bebas Neue"');
  await document.fonts.ready;
  const map = mountMap3D(document.querySelector('#map'), { interactive: false, width: 4961, height: 3508, pixelRatio: 1, preserveDrawingBuffer: true });
  map.render();
  if (map.renderer.domElement.projectedStops.length !== STOPS.length) throw new Error('Incomplete stop labels');
  console.table(map.renderer.domElement.projectedStops);
  window.__projectedStops = map.renderer.domElement.projectedStops;
  const canvas = document.querySelector('#output'), ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fdf3e3'; ctx.fillRect(0, 0, 4961, 3508);
  // The scene itself is rendered at full export resolution before compositing.
  ctx.drawImage(map.renderer.domElement, 1280, 600, 3681, 2603);
  ctx.font = '220px "Bebas Neue", Impact, sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f0625a'; ctx.fillText('NOTRE CIRCUIT', 180, 240);
  ctx.fillStyle = '#e2761d'; ctx.fillText('TOURISTIQUE', 1580, 240);
  ctx.fillStyle = '#1b2a4a'; ctx.font = '86px "Bebas Neue", Impact, sans-serif';
  ctx.fillText('5 arrêts incontournables dans le Mile End', 180, 390);
  ctx.fillStyle = '#f5dec2'; ctx.beginPath(); ctx.roundRect(180, 475, 1070, 140, 70); ctx.fill();
  ctx.fillStyle = '#1b2a4a'; ctx.font = '68px "Bebas Neue", Impact, sans-serif';
  ctx.fillText('≈ 1,2 km · 20 min à pied', 250, 570);
  const stops = STOPS.filter(stop => stop.id !== 'metro');
  ctx.strokeStyle = '#e2761d'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(205, 850); ctx.lineTo(205, 2810); ctx.stroke();
  stops.forEach(({name, number, description, extra}, i) => {
    const displayName = i === 3 ? 'ÉGLISE SAINT-MICHEL-' : name;
    const y = 850 + i * 490;
    ctx.fillStyle = '#e2761d'; ctx.beginPath(); ctx.arc(205, y, 22, 0, Math.PI*2); ctx.fill();
    ctx.font = '150px "Bebas Neue", Impact, sans-serif'; ctx.fillText(number, 280, y+45);
    ctx.fillStyle = '#1b2a4a'; ctx.font = '74px "Bebas Neue", Impact, sans-serif'; ctx.fillText(displayName, 410, y+12);
    if(i===3) ctx.fillText('ARCHANGE', 410, y+95);
    ctx.font = '38px system-ui, sans-serif'; ctx.fillText(description, 280, y+180);
    if(i===4) ctx.fillText(extra, 280, y+240);
  });
  ctx.fillStyle = '#1b2a4a'; ctx.font = '62px "Bebas Neue", Impact, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Manushi · Preshita · Fariba · Arina', 2480, 3400);
  window.__png = canvas.toDataURL('image/png');
  window.__done = true;
  map.dispose();
} catch (error) { window.__error = String(error); console.error(error); }
</script></body></html>
