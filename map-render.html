<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre circuit touristique — rendu haute résolution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>body{margin:0;background:#fdf3e3}#map{display:none}#output{display:block;width:100%;height:auto}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body><div id="map"></div><canvas id="output" width="4961" height="3508" aria-label="Notre circuit touristique du Mile End"></canvas>
<script type="module">
import { mountMap3D } from './map3d.js';
window.__done = false;
try {
  await document.fonts.load('100px "Bebas Neue"');
  await document.fonts.ready;
  const map = mountMap3D(document.querySelector('#map'), { interactive: false, width: 4961, height: 3508, pixelRatio: 1, preserveDrawingBuffer: true });
  map.render();
  const canvas = document.querySelector('#output'), ctx = canvas.getContext('2d');
  ctx.drawImage(map.renderer.domElement, 0, 0);
  ctx.fillStyle = '#fdf3e3'; ctx.fillRect(0, 0, 4961, 550);
  ctx.font = '220px "Bebas Neue", Impact, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#f0625a'; ctx.fillText('NOTRE CIRCUIT', 2480, 225);
  ctx.fillStyle = '#e2761d'; ctx.fillText('TOURISTIQUE', 2480, 425);
  ctx.fillStyle = '#1b2a4a'; ctx.font = '72px "Bebas Neue", Impact, sans-serif';
  ctx.fillText('5 arrêts incontournables dans le Mile End', 2480, 525);
  ctx.fillStyle = '#fdf3e3'; ctx.fillRect(0, 3330, 4961, 178);
  ctx.fillStyle = '#1b2a4a'; ctx.font = '62px "Bebas Neue", Impact, sans-serif';
  ctx.fillText('Manushi · Preshita · Fariba · Arina', 2480, 3435);
  window.__png = canvas.toDataURL('image/png');
  window.__done = true;
  map.dispose();
} catch (error) { window.__error = String(error); console.error(error); }
</script></body></html>
